services:

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 209715200
      KAFKA_REPLICA_FETCH_MAX_BYTES: 209715200
      KAFKA_FETCH_MESSAGE_MAX_BYTES: 209715200
    depends_on:
      - zookeeper
    networks:
      - backend

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - backend

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: MiClaveSegura123!
      MYSQL_DATABASE: tallerAR
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    networks:
      - backend
    healthcheck:
      # Importante: 1) 127.0.0.1; 2) -p SIN espacio; 3) $$ para que compose no lo expanda
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  app:
    build: .
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3307/tallerAR?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: MiClaveSegura123!
      SPRING_PROFILES_ACTIVE: heavy
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
      HEAVY_STARTUP_WAIT-MS: "20000"
      HEAVY_QPS_WRITES: "50"
      HEAVY_QPS_READS: "120"
      HEAVY_QPS_RESERVATIONS: "40"
      HEAVY_MAX_CONCURRENCY: "32"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW-DETAILS: always
      MANAGEMENT_ENDPOINT_MAPPINGS_ENABLED: true
    ports:
      - "8080:8080"
    networks:
      - backend
    volumes:
      - /application.yml

  light:
    image: node:20
    working_dir: /app
    command: bash -lc "npm ci || npm i && CHOKIDAR_USEPOLLING=1 npm run dev -- --host"
    environment:
      VITE_API: http://localhost:8080
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - ./tienda-spa:/app
    ports:
      - "5173:5173"
    depends_on:
      - app
    networks:
      - backend


networks:
  backend:

volumes:
  mysql_data:
