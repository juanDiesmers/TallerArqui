services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: MiClaveSegura123!
      MYSQL_DATABASE: tallerAR
      # opcional/cómodo: charset y collation por defecto
      # MYSQL_TCP_PORT: 3306   # si quisieras cambiar puerto interno
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"   # en dev puede quedar; en prod evita exponerlo
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy   # espera a que MySQL esté "healthy"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tallerAR?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: MiClaveSegura123!
      SPRING_PROFILES_ACTIVE: heavy
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
      HEAVY_STARTUP_WAIT-MS: "20000"
      HEAVY_QPS_WRITES: "50"
      HEAVY_QPS_READS: "120"
      HEAVY_QPS_RESERVATIONS: "40"
      HEAVY_MAX_CONCURRENCY: "32"
    ports:
      - "8080:8080"
    networks:
      - backend
    # opcional: healthcheck de la app si tienes actuator
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  light:
    image: node:20
    working_dir: /app
    command: bash -lc "npm ci || npm i && CHOKIDAR_USEPOLLING=1 npm run dev -- --host"
    environment:
      VITE_API: http://localhost:8080
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - ./tienda-spa:/app
    ports:
      - "5173:5173"
    depends_on:
      app:
        condition: service_started
    networks:
      - backend

networks:
  backend:

volumes:
  mysql_data:
