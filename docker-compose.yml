services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks: [backend]
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 209715200
      KAFKA_REPLICA_FETCH_MAX_BYTES: 209715200
      KAFKA_FETCH_MESSAGE_MAX_BYTES: 209715200
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks: [backend]
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "MiClaveSegura123!"
      MYSQL_DATABASE: tallerAR
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  app:
    build:
      context: ./Taller-Tienda       # ruta al Dockerfile de tu app
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tallerAR?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "MiClaveSegura123!"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Variables opcionales si integras WildFly:
      BRIDGE_JMS_ENABLED: "true"
      WILDFLY_JMS_HOST: wildfly
      WILDFLY_JMS_PORT: 5445
    ports:
      - "8080:8080"
    networks: [backend]
    restart: unless-stopped

  light:
    image: node:20
    working_dir: /app
    command: bash -lc "npm ci || npm i && CHOKIDAR_USEPOLLING=1 npm run dev -- --host"
    environment:
      VITE_API: http://localhost:8080    # El frontend se conecta al backend por localhost
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - ./Taller-Tienda/tienda-spa:/app
      - /app/node_modules 
    ports:
      - "5173:5173"
    depends_on:
      - app
    networks: [backend]
    restart: unless-stopped

networks:
  backend: {}

volumes:
  mysql_data: {}
